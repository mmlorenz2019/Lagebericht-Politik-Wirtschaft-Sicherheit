name: Täglicher Lagebericht

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Tests ausführen
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Berliner Zeit und Rückblicke prüfen
        id: schedule
        env:
          PYTHONPATH: src
          TZ: Europe/Berlin
        run: python -m lagebericht.schedule >> "$GITHUB_OUTPUT"
      - name: Tagesbericht erzeugen
        if: steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_EXTRACTION_MODEL: claude-haiku-4-5-20251001
          ANTHROPIC_SUMMARY_MODEL: claude-sonnet-4-6
        run: python scripts/run_daily.py --date "${{ steps.schedule.outputs.date }}"
      - name: Wochenbericht erzeugen
        if: steps.schedule.outputs.week == 'true' && (steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_SUMMARY_MODEL: claude-sonnet-4-6
        run: python scripts/run_period.py week --end-date "${{ steps.schedule.outputs.date }}"
      - name: Monatsbericht erzeugen
        if: steps.schedule.outputs.month == 'true' && (steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_SUMMARY_MODEL: claude-sonnet-4-6
        run: python scripts/run_period.py month --month "${{ steps.schedule.outputs.month_id }}"
      - name: Validierte Berichte versionieren
        if: steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: update briefing ${{ steps.schedule.outputs.date }}"
          git push
